api:
  host: http://localhost:${server.port}

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    path: /api/v1/ogc/swagger-ui
  api-docs:
    path: /api/v1/ogc/api-docs/v3

data-access-service:
  host: http://localhost:5000
  secret: 123
  connect-timeout: 5s
  read-timeout: 30s
  sse-idle-timeout: 2m

management:
  info:
    env:
      enabled: true
  health:
    elasticsearch:
      enabled: false
    diskspace:
      enabled: false
  endpoints:
    web:
      base-path: /api/v1/ogc/manage
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always
    logfile:
      external-file: /tmp/logs/ogcapi.log
# Actuator info point
info:
  application:
    name: '@project.name@'
    description: '@project.description@'
    version: '@project.version@'
  depServiceVersion: {}

logging:
  level:
    au.org.aodn.ogcapi.server: debug
