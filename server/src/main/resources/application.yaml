server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024 # Minimum response size in bytes to compress

ogcapi:
  debug:
    elasticsearch-explain-enabled: false
  http-cache:
    enabled: true
    mappings:
      - path: "/api/v1/ogc/collections"
        max-age-hours: 24
        expected-params:
          properties: "id,temporal"
          filter: "temporal after 1970-01-01T00:00:00Z" # Decoded space format
          sortby: "id"

elasticsearch:
  index:
    name: dev_portal_records
    # search_after batch for full-document / geometry / links queries, 800 match UI default
    pageSize: 800
    # search_after batch when properties is a small field list (id, temporal, title, ...)
    lightweightPageSize: 7000
  vocabs_index:
    name: vocabs_index
  cloud_optimized_index:
    name: es-coindexer-dev
  serverUrl: http://localhost:9200
  apiKey: <sample-api-key>
  search_as_you_type:
    search_suggestions:
      path: search_suggestions
      fields: abstract_phrases, parameter_vocabs_sayt, platform_vocabs_sayt, organisation_vocabs_sayt
  # Semantic suggestions: the vocabs index is searched by meaning (ELSER via semantic_text).
  # The suggested concepts are not filtered against records, so a suggestion may be a concept
  # no record currently carries.
  # Off by default - semantic_text needs the licensed `inference` feature.
  semantic:
    enabled: false
    # number of vocab docs (top-level categories) the semantic query returns
    size: 3
    # number of characters after user input to execute semantic query
    min_input_length: 3
    # highlight fragments per doc - one per matching level-2 concept
    fragments: 2
    # the max number of semantic suggestion returned from the flattened size * fragments
    max_suggestions: 3

aws:
  region: ap-southeast-2
  batch:
    job:
        queue: data-access-service-batch-job-queue
        definition: data-access-service-batch-job-definition
        # Defaults to the initial queue in BatchJobProperties. Dev deployments whose DAS
        # uses generate-csv-data-file must override this value explicitly.
        child-queue: data-access-service-batch-job-queue
        # Per-user download concurrency. A recipient already running max-concurrent downloads
        # is rejected outright until one of their own downloads finishes.
        user-limit:
          enabled: true
          max-concurrent: 10
          # How long the shared in-flight snapshot is reused before the queues are swept again.
          refresh-interval: 15s
        # Largest download accepted. The job writes to the 200 GB Fargate disk, so a download
        # estimated at max-size or more is rejected before it is submitted. Keep in line with
        # EXTRA_LARGE_DOWNLOAD_BYTES in the portal.
        size-limit:
          enabled: true
          max-size: 180GB
        # Fair-share tag for a download (#9348). A download estimated under small-max-size is
        # tagged small, anything else (including no estimate) large. The tag always goes out as
        # the share_identifier job parameter. enabled also sets it as the Batch shareIdentifier;
        # set it true only for an environment whose queue has a fair-share policy, and repoint
        # both queue and child-queue there. child-queue is set explicitly above, so overriding
        # queue alone leaves child-job lookups on the old queue.
        share:
          enabled: false
          small-max-size: 50MB
          small: small
          large: large

wfs-default-param:
  fields:
    SERVICE: "WFS"
    VERSION: "2.0.0"
    REQUEST: "DescribeFeatureType"
  download:
    SERVICE: "WFS"
    VERSION: "1.0.0"       # TODO: Full regression test need to Change to 2.0.0 because the download may work strange
    REQUEST: "GetFeature"
  estimate:
    SERVICE: "WFS"
    VERSION: "1.1.0"       # Must use 1.1.0 or above otherwise missing function to do size estimate
    REQUEST: "GetFeature"
  capabilities:
    SERVICE: "WFS"
    VERSION: "2.0.0"
    REQUEST: "GetCapabilities"

