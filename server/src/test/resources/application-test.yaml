ogcapi:
  docker:
    elasticVersion: "8.19.10"
  debug:
    elasticsearch-explain-enabled: true

elasticsearch:
  index:
    name: testing_index
    pageSize: 4
    lightweightPageSize: 4

  vocabs_index:
    name: test_vocabs_index

  search_as_you_type:
    search_suggestions:
      path: search_suggestions
      fields: abstract_phrases, parameter_vocabs_sayt, platform_vocabs_sayt, organisation_vocabs_sayt

  # no inference feature in test env so turn it off.
  semantic:
    enabled: false

# Tests must never reach live AWS Batch. The release loop already makes no AWS call while
# nothing is held; this makes that explicit for any test that does build a Spring context.
aws:
  batch:
    job:
      user-limit:
        enabled: false
